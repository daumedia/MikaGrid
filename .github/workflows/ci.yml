name: CI

# Bis 1.1.1 lief nichts automatisch: kein Test, kein Build-Gate, keine Prüfung, ob die
# Angaben auf der Website noch zu den Swift-Quellen passen. Jeder Fehler dieser Art fiel
# erst nach der Veröffentlichung auf.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  swift:
    name: Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Seit Feature 01 ist project.yml die Wahrheit über beide Bauziele, und
      # scripts/build.sh erzeugt daraus das Xcode-Projekt. Ohne XcodeGen bricht der
      # Bundle-Schritt ab — auf dem Runner ist es nicht vorinstalliert.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble and sign the app bundle (ad-hoc)
        run: bash scripts/build.sh

      - name: Verify the signature
        run: codesign --verify --deep --strict --verbose=2 "build/Mika+Grid.app"

      # Die zweite Fassung baut sonst nirgends automatisch — und sie ist der Grund für
      # das ganze Feature. Getrennter Ableitungsordner: Beide Ziele erzeugen
      # Mika+Grid.app und würden einander im gemeinsamen Produktordner überschreiben.
      - name: Build the App Store target
        run: |
          xcodegen generate
          xcodebuild -project MikaGrid.xcodeproj \
                     -scheme "MikaGrid (App Store)" \
                     -derivedDataPath build/xcode-mas \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO build

      # AK-02: Die Store-Fassung darf Sparkle nicht mitliefern. Das ist der Fehler, der
      # entsteht, wenn beide Ziele denselben Produktordner benutzen — geprüft statt
      # angenommen.
      - name: The App Store build ships no Sparkle
        run: |
          APP="build/xcode-mas/Build/Products/Debug/Mika+Grid.app"
          if [ -d "$APP/Contents/Frameworks/Sparkle.framework" ]; then
            echo "ERROR: the App Store build contains Sparkle.framework (AK-02)" >&2
            exit 1
          fi
          echo "OK — Frameworks: $(ls "$APP/Contents/Frameworks/" | tr '\n' ' ')"

  web:
    name: Website build
    runs-on: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  consistency:
    name: Version consistency
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Info.plist, CHANGELOG, appcast and web/lib agree
        run: bash scripts/release.sh --check

      - name: web/lib mirrors the Swift sources
        run: node scripts/check-web-sync.mjs

      - name: appcast.xml is well-formed
        run: xmllint --noout appcast.xml
