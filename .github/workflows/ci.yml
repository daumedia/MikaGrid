name: CI

# Bis 1.1.1 lief nichts automatisch: kein Test, kein Build-Gate, keine Prüfung, ob die
# Angaben auf der Website noch zu den Swift-Quellen passen. Jeder Fehler dieser Art fiel
# erst nach der Veröffentlichung auf.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  swift:
    name: Swift build & tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble and sign the app bundle (ad-hoc)
        run: bash scripts/build.sh

      - name: Verify the signature
        run: codesign --verify --deep --strict --verbose=2 "build/Mika+Grid.app"

  web:
    name: Website build
    runs-on: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  consistency:
    name: Version consistency
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Info.plist, CHANGELOG, appcast and web/lib agree
        run: bash scripts/release.sh --check

      - name: web/lib mirrors the Swift sources
        run: node scripts/check-web-sync.mjs

      - name: appcast.xml is well-formed
        run: xmllint --noout appcast.xml
